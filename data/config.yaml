match:
  video: "data\\full.mp4"
  meta_file: "data\\meta.json"
  tracking_produced: "data\\tracking-produced.jsonl"
  video_output: "data\\video-output.mp4"

output_jsonl_relative_file_path: "data\\football_output.jsonl"
show_output_overlay: true

yolo:
  keypoint_model: "data\\keypoint_model.pt"
  soccer_model: "data\\new_football_model.pt"
  selected_class_ids:
    ball:
      id: 0
      confidence_threshold: 0.1
    goalkeeper:
      id: 1
      confidence_threshold: 0.5
    player:
      id: 2
      confidence_threshold: 0.5


byte_track:
  track_activation_threshold: 0.25
  lost_track_buffer: 50
  minimum_matching_threshold: 0.8
  frame_rate: 25
  minimum_consecutive_frames: 1