match:
  video: "full.mp4"
  meta_file: "meta.json"
  tracking_produced: "tracking-produced.jsonl"

output_jsonl_relative_file_path: "football_output.jsonl"

yolo:
  keypoint_model: "keypoint_model.pt"
  soccer_model: "new_football_model.pt"
  selected_class_ids:
    ball:
      id: 0
      confidence_threshold: 0.1
    goalkeeper:
      id: 1
      confidence_threshold: 0.5
    player:
      id: 2
      confidence_threshold: 0.5


byte_track:
  track_activation_threshold: 0.25
  lost_track_buffer: 50
  minimum_matching_threshold: 0.8
  frame_rate: 25
  minimum_consecutive_frames: 1
